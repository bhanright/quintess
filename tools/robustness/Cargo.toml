[package]
name = "quintess-robustness"
description = "Developer tool: runs Quintess over the pdf.js test corpus and mutated files to find crashes, hangs and broken round trips. Not part of the shipped program."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "quintess-robustness"
path = "src/main.rs"

[dependencies]
quintess-core = { path = "../../crates/quintess-core" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.4.2"
sha2 = "0.11.0"
md-5 = "0.11.0"
