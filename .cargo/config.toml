# C: is nearly full on this machine; build output lives on E:.
[build]
target-dir = "E:/VellumBuild"

# The C runtime is linked into the programs, so they start on a Windows PC
# without the Visual C++ redistributable installed.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
