[package]
name = "quintess-app"
description = "The Quintess desktop application: view, annotate, fill, organize and secure PDF files. A library, started by the `quintess` program (crates/quintess-cli)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
quintess-core = { path = "../quintess-core" }
eframe = { version = "0.36", features = ["glow"] }
egui = "0.36"
egui_extras = "0.36"
rfd = "0.17"
anyhow = "1"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4.45"
tts = "0.26.3"

# Documents opened from the Finder and the Dock's Quit arrive as Apple
# events (see src/desktop.rs); objc2 adjusts the application menu.
[target.'cfg(target_os = "macos")'.dependencies]
fmv-macos-events = "=0.1.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
ttf-parser = "0.25"
# Waits on wgpu calls in the renderer start-up tests (src/window_start.rs);
# the version eframe already uses.
pollster = "1.0.1"
