[package]
name = "quintess-app"
description = "The Quintess desktop application: view, annotate, fill, organize and secure PDF files."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "quintess-app"
path = "src/main.rs"

[dependencies]
quintess-core = { path = "../quintess-core" }
eframe = { version = "0.36", features = ["glow"] }
egui = "0.36"
egui_extras = "0.36"
rfd = "0.17"
anyhow = "1"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4.45"
tts = "0.26.3"

[build-dependencies]
winresource = "0.1.31"
