[package]
name = "vellum-core"
description = "The document engine behind Vellum: reading, editing, securing, converting and writing PDF files."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lopdf = "0.45"
pdfium-render = "0.9.4"
image = "0.25"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"
getrandom = "0.4.3"
