[package]
name = "vellum-cli"
description = "Vellum from the command line: every document operation, scriptable."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vellum"
path = "src/main.rs"

[dependencies]
vellum-core = { path = "../vellum-core" }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde_json = "1"
regex = "1"
image = "0.25"

[build-dependencies]
winresource = "0.1.31"
