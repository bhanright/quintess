[package]
name = "quintess-cli"
description = "Quintess from the command line: every document operation, scriptable."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "quintess"
path = "src/main.rs"

[dependencies]
quintess-core = { path = "../quintess-core" }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde_json = "1"
regex = "1"
image = "0.25"

[build-dependencies]
winresource = "0.1.31"
