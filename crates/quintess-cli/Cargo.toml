[package]
name = "quintess-cli"
description = "Quintess from the command line, every document operation scriptable, and the `quintess` program, which is also the desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true

# The library (src/lib.rs) is the command-line tool. The binary
# (src/main.rs) is the one Quintess program: it runs the command-line tool
# for a command and the app (crates/quintess-app) otherwise. It lives in
# this package so the command-line tests can run it as CARGO_BIN_EXE_quintess.
[[bin]]
name = "quintess"
path = "src/main.rs"

[dependencies]
quintess-core = { path = "../quintess-core" }
quintess-app = { path = "../quintess-app" }
quintess-console = { path = "../quintess-console" }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde_json = "1"
regex = "1"
image = "0.25"

[build-dependencies]
winresource = "0.1.31"
