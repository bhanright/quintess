[package]
name = "quintess-core"
description = "The document engine behind Quintess: reading, editing, securing, converting and writing PDF files."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lopdf = "0.45"
pdfium-render = "0.9.4"
image = "0.25"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"
getrandom = "0.4.3"
ttf-parser = "0.25"
subsetter = "0.2"
docx-rs = "0.4.22"
base64 = "0.23.1"
similar = "3.2.0"
ocrs = "0.13"
rten = "0.26"
ureq = "3.4.2"
rcgen = "0.14"
x509-parser = { version = "0.18.1", features = ["verify"] }
sha2 = "0.11.0"
ring = "0.17"
csv = "1.4.0"
calamine = { version = "0.36.1", features = ["chrono"] }
rustybuzz = "0.20.1"
unicode-bidi = "0.3.18"
rqrr = "0.11.0"
spellbook = "0.4.2"
rust_xlsxwriter = "0.99.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
p12-keystore = "0.4.0"
webpki-root-certs = "1.0.9"
# Form scripts (form_scripts.rs). Without its default features Boa leaves
# out Temporal and its time zone data; Annex B adds the older string
# functions (substr, escape) that Acrobat-era scripts use.
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b"] }
quick-xml = "0.41"
# Word layout for the built-in .docx conversion (MPL-2.0; pinned because its API is still 0.x).
oxidocs = { version = "=0.8.0", optional = true }
# RSA key transport for certificate encryption (public_key.rs); ring cannot encrypt with RSA.
rsa = "0.9.10"

[features]
default = ["word-layout"]
# The built-in Word (.docx) converter. It adds about 15 MB to the program
# (Word font metrics are compiled in); without it, .docx files need
# LibreOffice or Microsoft Office.
word-layout = ["dep:oxidocs"]

[dev-dependencies]
image = "0.25"
qrcode = "0.14.1"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Registry"] }
