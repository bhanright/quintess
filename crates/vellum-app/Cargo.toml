[package]
name = "vellum-app"
description = "The Vellum desktop application: view, annotate, fill, organize and secure PDF files."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vellum-app"
path = "src/main.rs"

[dependencies]
vellum-core = { path = "../vellum-core" }
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
rfd = "0.17"
anyhow = "1"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
