[workspace]
resolver = "3"
members = ["crates/vellum-core", "crates/vellum-cli", "crates/vellum-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"


# Full debug info for every dependency made the build folder grow past 13 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# What ships: optimized across crates, without debug symbols.
[profile.release]
lto = "thin"
codegen-units = 4
strip = true
