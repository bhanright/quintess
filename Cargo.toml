[workspace]
resolver = "3"
members = ["crates/quintess-core", "crates/quintess-cli", "crates/quintess-app", "crates/quintess-console"]
# vendor/ holds patched copies of crates.io crates (see [patch.crates-io] below), not members.
exclude = ["vendor"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"


# Full debug info for every dependency made the build folder grow past 13 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# What ships: optimized across crates, without debug symbols.
[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# The form-script engine (Boa) is large; form scripts are tiny and run in
# milliseconds either way, so its libraries are built for size, not speed.
[profile.release.package.boa_engine]
opt-level = "s"

[profile.release.package.boa_parser]
opt-level = "s"

[profile.release.package.boa_ast]
opt-level = "s"

[profile.release.package.regress]
opt-level = "s"

# Window-layer fixes carried as patched copies of two crates (vendor/README.md
# lists each patch, the bug it fixes and the test that keeps it). They come from
# PdfCraft (MIT OR Apache-2.0). Drop a copy once an upstream release has its fixes.
[patch.crates-io]
winit = { path = "vendor/winit" }
egui-wgpu = { path = "vendor/egui-wgpu" }
